name: Upstream Sync

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  sync:
    name: Merge stable upstream release
    if: github.repository == 'nguyenphutrong/oh-my-t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Merge stable release and update pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_BRANCH: sync/upstream
          UPSTREAM_URL: https://github.com/pingdotgg/t3code.git
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags origin main:refs/remotes/origin/main

          # This endpoint returns one GitHub-selected stable release, so no paginated release scan is needed.
          if ! release_json="$(gh api repos/pingdotgg/t3code/releases/latest)"; then
            echo "### Upstream sync blocked" >> "$GITHUB_STEP_SUMMARY"
            echo "No stable upstream GitHub Release could be retrieved. No changes were pushed." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::No stable upstream GitHub Release is available."
            exit 1
          fi

          if ! release_tag="$(jq -er 'select(.draft == false and .prerelease == false) | .tag_name | select(type == "string" and length > 0)' <<< "$release_json")"; then
            echo "### Upstream sync blocked" >> "$GITHUB_STEP_SUMMARY"
            echo "The latest upstream release is not a valid stable release. No changes were pushed." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::The upstream release is a draft, prerelease, or has no valid tag."
            exit 1
          fi

          if ! git check-ref-format "refs/tags/$release_tag" >/dev/null ||
            ! git fetch --no-tags upstream "refs/tags/$release_tag:refs/upstream-release/tag"; then
            echo "### Upstream sync blocked" >> "$GITHUB_STEP_SUMMARY"
            echo "Stable release tag \`$release_tag\` does not exist or is invalid. No changes were pushed." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Stable release tag $release_tag could not be verified."
            exit 1
          fi

          if ! release_commit="$(git rev-parse --verify 'refs/upstream-release/tag^{commit}')"; then
            echo "### Upstream sync blocked" >> "$GITHUB_STEP_SUMMARY"
            echo "Stable release tag \`$release_tag\` does not resolve to a commit. No changes were pushed." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Stable release tag $release_tag does not resolve to a commit."
            exit 1
          fi

          if git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "Stable release $release_tag ($release_commit) is already in main."
            echo "### Upstream sync" >> "$GITHUB_STEP_SUMMARY"
            echo "Stable release \`$release_tag\` (\`$release_commit\`) is already synchronized." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "refs/heads/$SYNC_BRANCH" >/dev/null; then
            git fetch --no-tags origin "$SYNC_BRANCH:refs/remotes/origin/$SYNC_BRANCH"
            git switch --create "$SYNC_BRANCH" --track "origin/$SYNC_BRANCH"
          else
            git switch --create "$SYNC_BRANCH" origin/main
          fi

          merge_or_fail() {
            local source="$1"
            local description="$2"
            if git merge --no-edit "$source"; then
              return
            fi

            local conflicts
            conflicts="$(git diff --name-only --diff-filter=U)"
            git merge --abort || true
            {
              echo "### Upstream sync blocked"
              echo
              echo "Merging $description into \`$SYNC_BRANCH\` failed. No branch changes were pushed."
              if [[ -n "$conflicts" ]]; then
                echo
                echo "Conflicting files:"
                while IFS= read -r file; do
                  echo "- \`$file\`"
                done <<< "$conflicts"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Merge conflict while merging $description. No changes were pushed."
            exit 1
          }

          merge_or_fail origin/main "the latest fork main"
          if ! git merge-base --is-ancestor "$release_commit" HEAD; then
            merge_or_fail refs/upstream-release/tag "stable release $release_tag ($release_commit)"
          fi
          git push origin "HEAD:refs/heads/$SYNC_BRANCH"

          body="$RUNNER_TEMP/upstream-sync-pr.md"
          cat > "$body" <<EOF
          Automated merge of the latest stable [pingdotgg/t3code](https://github.com/pingdotgg/t3code) GitHub Release into this fork.

          Stable release: \`$release_tag\`
          Source commit: \`$release_commit\`

          This pull request is updated by the weekly upstream sync workflow. Review and merge it manually; auto-merge is intentionally disabled.
          EOF

          gh label create upstream-sync \
            --repo "$GITHUB_REPOSITORY" \
            --color "1d76db" \
            --description "Automated synchronization from the upstream repository" \
            --force

          pr_number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --base main \
            --head "$SYNC_BRANCH" \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --title "chore: sync upstream $release_tag" \
              --body-file "$body" \
              --add-label upstream-sync
            echo "Updated pull request #$pr_number."
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$SYNC_BRANCH" \
              --title "chore: sync upstream $release_tag" \
              --body-file "$body" \
              --label upstream-sync
          fi
