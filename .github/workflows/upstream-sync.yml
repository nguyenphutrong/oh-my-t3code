name: Upstream Sync

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  sync:
    name: Merge upstream into sync branch
    if: github.repository == 'nguyenphutrong/oh-my-t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Merge upstream and update pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_BRANCH: sync/upstream
          UPSTREAM_URL: https://github.com/pingdotgg/t3code.git
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git fetch --no-tags upstream main:refs/remotes/upstream/main

          missing_count="$(git rev-list --count origin/main..upstream/main)"
          if [[ "$missing_count" == "0" ]]; then
            echo "Upstream main has no commits missing from the fork."
            echo "### Upstream sync" >> "$GITHUB_STEP_SUMMARY"
            echo "No new upstream commits were found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "refs/heads/$SYNC_BRANCH" >/dev/null; then
            git fetch --no-tags origin "$SYNC_BRANCH:refs/remotes/origin/$SYNC_BRANCH"
            git switch --create "$SYNC_BRANCH" --track "origin/$SYNC_BRANCH"
          else
            git switch --create "$SYNC_BRANCH" origin/main
          fi

          merge_or_fail() {
            local source="$1"
            local description="$2"
            if git merge --no-edit "$source"; then
              return
            fi

            local conflicts
            conflicts="$(git diff --name-only --diff-filter=U)"
            git merge --abort || true
            {
              echo "### Upstream sync blocked"
              echo
              echo "Merging $description into \`$SYNC_BRANCH\` failed. No branch changes were pushed."
              if [[ -n "$conflicts" ]]; then
                echo
                echo "Conflicting files:"
                while IFS= read -r file; do
                  echo "- \`$file\`"
                done <<< "$conflicts"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Merge conflict while merging $description. No changes were pushed."
            exit 1
          }

          merge_or_fail origin/main "the latest fork main"
          merge_or_fail upstream/main "upstream/main"
          git push origin "HEAD:refs/heads/$SYNC_BRANCH"

          upstream_sha="$(git rev-parse upstream/main)"
          body="$RUNNER_TEMP/upstream-sync-pr.md"
          cat > "$body" <<EOF
          Automated merge of [pingdotgg/t3code](https://github.com/pingdotgg/t3code)'s \`main\` branch into this fork.

          Upstream commit: \`$upstream_sha\`

          This pull request is updated by the weekly upstream sync workflow. Review and merge it manually; auto-merge is intentionally disabled.
          EOF

          gh label create upstream-sync \
            --repo "$GITHUB_REPOSITORY" \
            --color "1d76db" \
            --description "Automated synchronization from the upstream repository" \
            --force

          pr_number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --base main \
            --head "$SYNC_BRANCH" \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --title "chore: sync upstream main" \
              --body-file "$body" \
              --add-label upstream-sync
            echo "Updated pull request #$pr_number."
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$SYNC_BRANCH" \
              --title "chore: sync upstream main" \
              --body-file "$body" \
              --label upstream-sync
          fi
